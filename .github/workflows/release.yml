name: Build & Release (Manual Dispatch)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'
      platform:
        description: 'Platforms to build and upload'
        required: true
        default: 'windows'
        type: choice
        options:
          - windows
          - macos
          - all

permissions:
  contents: write

jobs:
  build-windows:
    if: inputs.platform == 'windows' || inputs.platform == 'all'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Versioned Windows EXE & Run Self-Test
        shell: pwsh
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          ./build.ps1
          ./SpanShot.exe --self-test | Out-Host
          $ver = if ($env:TAG_NAME.StartsWith("v")) { $env:TAG_NAME } else { "v$($env:TAG_NAME)" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Force ./SpanShot.exe "dist/SpanShot_${ver}.exe"
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpanShot-windows
          path: dist/SpanShot_*.exe

  build-macos:
    if: inputs.platform == 'macos' || inputs.platform == 'all'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Versioned macOS DMGs (Apple Silicon + Universal)
        env:
          SPANSHOT_VERSION: ${{ inputs.tag_name }}
        run: |
          if [ -f "./macos/build_dmg.sh" ]; then
            chmod +x ./macos/build_dmg.sh
            ./macos/build_dmg.sh
          fi
      - name: Upload macOS Artifacts
        if: hashFiles('macos/build/*.dmg', 'macos/*.dmg', '*.dmg') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SpanShot-macos
          path: |
            macos/build/*.dmg
            macos/*.dmg
            *.dmg

  publish-release:
    needs: [build-windows, build-macos]
    if: always() && (needs.build-windows.result == 'success' || needs.build-macos.result == 'success') && needs.build-windows.result != 'failure' && needs.build-macos.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Download Selected Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: SpanShot ${{ inputs.tag_name }}
          generate_release_notes: true
          files: |
            release-assets/SpanShot_*.exe
            release-assets/SpanShot_*.dmg
