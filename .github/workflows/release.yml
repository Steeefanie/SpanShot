name: Build & Release (Windows .exe & macOS .dmg)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.1.0)'
        required: false
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Versioned Windows EXE & Run Self-Test
        shell: pwsh
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          ./build.ps1
          ./SpanShot.exe --self-test | Out-Host
          $ver = if ($env:TAG_NAME.StartsWith("v")) { $env:TAG_NAME } else { "v$($env:TAG_NAME)" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Force ./SpanShot.exe "dist/SpanShot_${ver}_Windows.exe"
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpanShot-windows
          path: dist/SpanShot_*_Windows.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Versioned macOS DMGs (Apple Silicon + Universal)
        env:
          SPANSHOT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          if [ -f "./macos/build_dmg.sh" ]; then
            chmod +x ./macos/build_dmg.sh
            ./macos/build_dmg.sh
          fi
      - name: Upload macOS Artifacts
        if: hashFiles('macos/build/*.dmg', 'macos/*.dmg', '*.dmg') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SpanShot-macos
          path: |
            macos/build/*.dmg
            macos/*.dmg
            *.dmg

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false
      - name: Upload Versioned Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          find release-assets -type f \( -name "*.exe" -o -name "*.dmg" \) -exec cp -f {} dist/ \;
          ls -lh dist/
          if gh release view "$TAG_NAME" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG_NAME" dist/* --title "SpanShot $TAG_NAME" --generate-notes --repo "${{ github.repository }}"
          fi
