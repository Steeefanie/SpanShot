name: Build & Release (Windows .exe & macOS .dmg)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SpanShot.exe & Run Self-Test
        shell: pwsh
        run: |
          ./build.ps1
          ./SpanShot.exe --self-test | Out-Host
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpanShot-windows
          path: SpanShot.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SpanShot.dmg (if macos/build_dmg.sh exists)
        run: |
          if [ -f "./macos/build_dmg.sh" ]; then
            chmod +x ./macos/build_dmg.sh
            ./macos/build_dmg.sh
          fi
      - name: Upload macOS Artifact
        if: hashFiles('macos/SpanShot.dmg', 'SpanShot.dmg') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SpanShot-macos
          path: |
            SpanShot.dmg
            macos/SpanShot.dmg
